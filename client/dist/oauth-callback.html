<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đang xác thực tài khoản...</title>
  <style>
    body {
      background-color: #0B0F19;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 14px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Đang hoàn tất đăng nhập, vui lòng chờ trong giây lát...</p>

  <script>
    (function () {
      var hash = window.location.hash.substring(1);
      var query = window.location.search.substring(1);
      var params = new URLSearchParams(hash || query);

      var idToken = params.get('id_token');
      var accessToken = params.get('access_token');
      var code = params.get('code');
      var error = params.get('error') || params.get('error_description');

      if (window.opener) {
        window.opener.postMessage(
          {
            type: 'OAUTH_RESPONSE',
            idToken: idToken,
            accessToken: accessToken,
            code: code,
            error: error,
          },
          window.location.origin
        );
        setTimeout(function () {
          window.close();
        }, 500);
      } else {
        if (idToken) {
          localStorage.setItem('temp_oauth_id_token', idToken);
        }
        if (accessToken) {
          localStorage.setItem('temp_oauth_access_token', accessToken);
        }
        window.location.href = '/';
      }
    })();
  </script>
</body>
</html>
