name: Mobile Android APK CI/CD & Release

on:
  push:
    branches:
      - Mobile
      - FE
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tự động tạo / cập nhật GitHub Release đính kèm APK'
        required: true
        type: boolean
        default: true
      release_title:
        description: 'Tiêu đề bản phát hành (Release Title)'
        required: false
        default: 'MicroLearning Mobile App v2.0.0 (Release APK)'

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: 🔨 Build Android Release APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: 🔍 TypeScript Strict Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: 🚀 Build Release APK with Gradle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 🏷️ Prepare APK Artifact
        id: prepare_apk
        run: |
          APK_DIR="mobile/android/app/build/outputs/apk/release"
          TARGET_APK="mobile/MicroLearning-v2.0.0.apk"
          
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "$TARGET_APK"
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
            echo "✅ Tìm thấy app-release.apk và đã sao chép sang $TARGET_APK"
          elif [ -f "$APK_DIR/app-release-unsigned.apk" ]; then
            cp "$APK_DIR/app-release-unsigned.apk" "$TARGET_APK"
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
            echo "⚠️ Tìm thấy app-release-unsigned.apk và đã sao chép sang $TARGET_APK"
          else
            echo "❌ Không tìm thấy file APK sau khi build!"
            find mobile/android/app/build/outputs -type f -name "*.apk"
            exit 1
          fi

          ls -lh "$TARGET_APK"

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MicroLearning-v2.0.0-APK
          path: mobile/MicroLearning-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🌐 Publish GitHub Release (Phát hành App Mobile)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/Mobile'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.0-mobile' }}
          name: ${{ inputs.release_title || 'MicroLearning Mobile App v2.0.0 (Release APK)' }}
          body: |
            ## 📱 MicroLearning Mobile App - Bản phát hành chính thức (v2.0.0)

            Ứng dụng di động học tập thông minh MicroLearning chuẩn thực chiến trên nền tảng **React Native / Expo 57**.

            ### 🚀 Tính năng nổi bật trong bản phát hành:
            - **Micro-lessons ngắn gọn**: Bài học video 3-5 phút cô đọng, xem trực quan không nhàm chán.
            - **Cloud Video Streaming**: Đồng bộ bài giảng từ Azure Cloud, hỗ trợ đánh dấu mốc video quan trọng.
            - **Chế độ Ngoại tuyến (Offline-First)**: Tải video và tài liệu về máy học không cần kết nối mạng.
            - **Sổ tay ôn câu sai (Mistake Vault)**: Tự động lưu các câu hỏi trắc nghiệm làm sai để luyện tập lại.
            - **Gamification & Streak**: Chuỗi học liên tục hàng ngày giữ vững kỷ luật học tập.
            - **Xác thực OTP & OAuth2.0**: Đăng ký số điện thoại thực tế nhận mã OTP và đăng nhập 1 chạm Google / Facebook trực tiếp.

            ---

            ### 📥 Hướng dẫn cài đặt file APK trên thiết bị Android:
            1. Tải file **`MicroLearning-v2.0.0.apk`** ở mục **Assets** bên dưới.
            2. Mở file APK vừa tải về trên điện thoại của bạn.
            3. Khi hệ thống hiển thị thông báo bảo mật cài đặt ứng dụng từ nguồn ngoài, chọn **Cài đặt / Tiếp tục (Allow from this source)**.
            4. Khởi chạy ứng dụng và bắt đầu học tập ngay!
          files: |
            mobile/MicroLearning-v2.0.0.apk
          draft: false
          prerelease: false
