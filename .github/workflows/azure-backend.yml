name: Build and Deploy ASP.NET Core to Azure App Service

on:
  push:
    branches:
      - main
      - Mobile
      - FE
    paths:
      - 'Areas/**'
      - 'Model/**'
      - 'Properties/**'
      - 'Program.cs'
      - 'appsettings*.json'
      - '*.csproj'
      - '.github/workflows/azure-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Core SDK 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Backend (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Publish Backend for Linux
        run: dotnet publish Microlearning.csproj --configuration Release -r linux-x64 --self-contained false --output ./publish-output

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'microlearning-backend'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish-output
